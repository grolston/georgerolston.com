	<style>
		:root {
			--bg: #0a0d14;
			--text: #eef1f6;

			--card: rgba(255, 255, 255, 0.035);

			--glow-a: rgba(255, 153, 0, 0.20);
			--glow-b: rgba(72, 118, 255, 0.22);
			--grid: rgba(255, 255, 255, 0.045);
			--sans: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			--mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		}

		@media (prefers-color-scheme: light) {
			:root {
				--bg: #f5f6f8;
				--text: #0d1220;

				--card: rgba(255, 255, 255, 0.7);

				--accent: #c96a00;
				--glow-a: rgba(255, 153, 0, 0.22);
				--glow-b: rgba(72, 118, 255, 0.18);
				--grid: rgba(13, 18, 32, 0.05);
			}
		}

		*, *::before, *::after { box-sizing: border-box; }

		html { -webkit-text-size-adjust: 100%; }

		body {
			margin: 0;
			min-height: 100vh;
			min-height: 100dvh;
			display: flex;
			flex-direction: column;
			background: var(--bg);
			color: var(--text);
			font-family: var(--sans);
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
			overflow-x: hidden;
		}

		/* Background: faint grid plus two slow-drifting glows */
		.backdrop {
			position: fixed;
			inset: 0;
			z-index: -1;
			overflow: hidden;
			pointer-events: none;
		}

		.backdrop::before {
			content: "";
			position: absolute;
			inset: 0;
			background-image:
				linear-gradient(var(--grid) 1px, transparent 1px),
				linear-gradient(90deg, var(--grid) 1px, transparent 1px);
			background-size: 56px 56px;
			-webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 75%);
			mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 75%);
		}

		.glow {
			position: absolute;
			width: 60vmax;
			height: 60vmax;
			border-radius: 50%;
			filter: blur(90px);
			animation: drift 26s ease-in-out infinite alternate;
		}

		.glow.a { top: -30vmax; right: -18vmax; background: radial-gradient(circle, var(--glow-a), transparent 65%); }
		.glow.b { bottom: -34vmax; left: -20vmax; background: radial-gradient(circle, var(--glow-b), transparent 65%); animation-delay: -13s; }

		@keyframes drift {
			from { transform: translate3d(0, 0, 0) scale(1); }
			to { transform: translate3d(-6vmax, 5vmax, 0) scale(1.12); }
		}

		main {
			flex: 1;
			display: flex;
			flex-direction: column;
			justify-content: center;
			width: 100%;
			max-width: 46rem;
			margin: 0 auto;
			padding: 4rem 1.5rem 2rem;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.9rem, 11vw, 5.75rem);
			font-weight: 700;
			line-height: 0.98;
			letter-spacing: -0.04em;
			text-wrap: balance;
		}

		.tagline {
			display: flex;
			flex-wrap: wrap;
			gap: 0.35rem 0.9rem;
			margin: 1.6rem 0 0;
			font-family: var(--mono);
			font-size: clamp(0.8rem, 2.4vw, 0.95rem);
			color: var(--muted);
		}

		.tagline span:not(:last-child)::after {
			content: "/";
			margin-left: 0.9rem;
			color: var(--accent);
		}

		.links {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 0.75rem;
			margin: 3rem 0 0;
			padding: 0;
			list-style: none;
		}

		.links a {
			display: flex;
			align-items: center;
			gap: 0.9rem;
			padding: 1rem 1.1rem;
			border: 1px solid var(--line);
			border-radius: 14px;
			background: var(--card);
			color: inherit;
			text-decoration: none;
			-webkit-backdrop-filter: blur(8px);
			backdrop-filter: blur(8px);
			transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
		}

		.links a:hover {
			transform: translateY(-2px);
			background: var(--card-hover);
			border-color: color-mix(in srgb, var(--accent) 55%, transparent);
		}

		.links a:focus-visible,
		footer a:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 3px;
		}

		.links svg { flex: none; fill: currentColor; }
		.links .brand { width: 1.5rem; height: 1.5rem; }

		.links .text { display: flex; flex-direction: column; min-width: 0; }
		.links .name { font-weight: 500; line-height: 1.25; }

		.links .handle {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			font-family: var(--mono);
			font-size: 0.78rem;
			color: var(--muted);
		}

		.links .arrow {
			width: 1rem;
			height: 1rem;
			margin-left: auto;
			fill: none;
			stroke: var(--muted);
			stroke-width: 1.75;
			stroke-linecap: round;
			stroke-linejoin: round;
			transition: transform 0.2s ease, stroke 0.2s ease;
		}

		.links a:hover .arrow { transform: translate(2px, -2px); stroke: var(--accent); }

		footer {
			width: 100%;
			max-width: 46rem;
			margin: 0 auto;
			padding: 1.5rem;
			font-family: var(--mono);
			font-size: 0.75rem;
			color: var(--muted);
		}

		/* Entrance */
		h1, .tagline, .links li, footer { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
		.tagline { animation-delay: 0.08s; }
		.links li:nth-child(1) { animation-delay: 0.16s; }
		.links li:nth-child(2) { animation-delay: 0.22s; }
		.links li:nth-child(3) { animation-delay: 0.28s; }
		.links li:nth-child(4) { animation-delay: 0.34s; }
		footer { animation-delay: 0.45s; }

		@keyframes rise {
			from { opacity: 0; transform: translateY(14px); }
			to { opacity: 1; transform: none; }
		}

		@media (max-width: 34rem) {
			main { padding-top: 3rem; }
			.links { grid-template-columns: 1fr; margin-top: 2.25rem; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation: none !important; transition: none !important; }
