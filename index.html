	<style>
		:root {
			--night: #081230;
			--cream: #f4ecd2;
			--cream-dim: #c9c6bb;
			--gold: #f0c038;
			--swatch: rgba(9, 20, 52, 0.80);
			--swatch-hover: rgba(28, 72, 140, 0.88);
			--display: "Playfair Display", Georgia, "Times New Roman", serif;
			--serif: Lora, Georgia, "Times New Roman", serif;
		}

		*, *::before, *::after { box-sizing: border-box; }

		html { -webkit-text-size-adjust: 100%; }

		body {
			margin: 0;
			min-height: 100vh;
			min-height: 100dvh;
			display: flex;
			flex-direction: column;
			/* Shown until the painting is drawn, and if scripts are off */
			background: linear-gradient(#070d26, #0f2658 55%, #0a1a3c);
			color: var(--cream);
			font-family: var(--serif);
			font-weight: 500;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
			overflow-x: hidden;
		}

		/* The painting: a canvas of brushstrokes, a canvas-weave relief, and a
		   soft shadow behind the text so it stays readable. */
		.backdrop {
			position: fixed;
			inset: 0;
			z-index: -1;
			overflow: hidden;
			pointer-events: none;
		}

		.backdrop canvas,
		.backdrop .weave {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
		}

		.backdrop .weave { mix-blend-mode: soft-light; opacity: 0.6; }

		.backdrop::after {
			content: "";
			position: absolute;
			inset: 0;
			background: radial-gradient(ellipse 70% 60% at 50% 48%, rgba(4, 9, 28, 0.6), rgba(4, 9, 28, 0.2) 70%, transparent);
		}

		.filters { position: absolute; width: 0; height: 0; }

		main {
			flex: 1;
			display: flex;
			flex-direction: column;
			justify-content: center;
			width: 100%;
			max-width: 46rem;
			margin: 0 auto;
			padding: 4rem 1.5rem 2rem;
		}

		/* A daub of paint behind an element: rough edges, bristle streaks */
		.badge, .links a { position: relative; isolation: isolate; }

		.badge::before, .links a::before {
			content: "";
			position: absolute;
			inset: 0;
			z-index: -1;
			filter: url(#paint);
			transition: background-color 0.25s ease;
		}

		.badge {
			align-self: flex-start;
			margin: 0 0 1.4rem;
			padding: 0.35rem 1rem 0.4rem;
			color: #0a1638;
			font-size: 0.86rem;
			font-weight: 600;
			letter-spacing: 0.01em;
			text-decoration: none;
		}

		.badge::before { background: var(--gold); border-radius: 999px; }
		.badge:hover::before { background: #ffd65c; }

		h1 {
			margin: 0;
			font-family: var(--display);
			font-size: clamp(2.9rem, 11vw, 5.75rem);
			font-weight: 800;
			line-height: 1.02;
			letter-spacing: -0.01em;
			text-wrap: balance;
			color: var(--cream);
			filter: url(#paint);
		}

		h1 .gold { color: var(--gold); }

		.tagline {
			display: flex;
			flex-wrap: wrap;
			gap: 0.3rem 0.8rem;
			margin: 1.4rem 0 0;
			font-style: italic;
			font-size: clamp(1rem, 2.8vw, 1.15rem);
			color: var(--cream);
			text-shadow: 0 1px 6px rgba(3, 8, 26, 0.9);
		}

		.tagline span:not(:last-child)::after {
			content: "\2022";
			margin-left: 0.8rem;
			font-style: normal;
			color: var(--gold);
		}

		.links {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
			margin: 3rem 0 0;
			padding: 0;
			list-style: none;
		}

		.links a {
			display: flex;
			align-items: center;
			gap: 1rem;
			padding: 1.05rem 1.25rem;
			color: var(--cream);
			text-decoration: none;
			transition: transform 0.25s ease;
		}

		.links a::before { background: var(--swatch); border-radius: 10px; }
		.links a:hover { transform: translateY(-2px) rotate(-0.4deg); }
		.links a:hover::before { background: var(--swatch-hover); }

		.links a:focus-visible,
		.badge:focus-visible {
			outline: 2px solid var(--gold);
			outline-offset: 5px;
		}

		.links svg { flex: none; }

		.links .brand {
			width: 1.7rem;
			height: 1.7rem;
			fill: currentColor;
			transition: color 0.25s ease;
		}

		.links a:hover .brand { color: var(--gold); }

		.links .text { display: flex; flex-direction: column; min-width: 0; }
		.links .name { font-weight: 600; font-size: 1.08rem; line-height: 1.25; }

		.links .handle {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			font-style: italic;
			font-size: 0.88rem;
			color: var(--cream-dim);
		}

		.links .arrow {
			width: 1rem;
			height: 1rem;
			margin-left: auto;
			fill: none;
			stroke: var(--cream-dim);
			stroke-width: 1.9;
			stroke-linecap: round;
			stroke-linejoin: round;
			transition: transform 0.25s ease, stroke 0.25s ease;
		}

		.links a:hover .arrow { transform: translate(2px, -2px); stroke: var(--gold); }

		footer {
			width: 100%;
			max-width: 46rem;
			margin: 0 auto;
			padding: 1.5rem;
			font-style: italic;
			font-size: 0.85rem;
			color: var(--cream-dim);
			text-shadow: 0 1px 6px rgba(3, 8, 26, 0.9);
		}

		/* Entrance */
		.badge, h1, .tagline, .links li, footer { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
		.tagline { animation-delay: 0.08s; }
		.links li:nth-child(1) { animation-delay: 0.16s; }
		.links li:nth-child(2) { animation-delay: 0.22s; }
		.links li:nth-child(3) { animation-delay: 0.28s; }
		.links li:nth-child(4) { animation-delay: 0.34s; }
		footer { animation-delay: 0.45s; }

		@keyframes rise {
			from { opacity: 0; transform: translateY(14px); }
			to { opacity: 1; transform: none; }
		}

		@media (max-width: 34rem) {
			main { padding-top: 3rem; }
			.links { grid-template-columns: 1fr; margin-top: 2.25rem; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation: none !important; transition: none !important; }
		}

	<script>
		document.getElementById('year').textContent = new Date().getFullYear();

		// Paints the backdrop: layers of short, thick brushstrokes in night blues,
		// laid in calm horizontal waves, with a few warm dabs of gold. The seed is
		// fixed, so it is the same painting on every visit.
		(function () {
			var canvas = document.getElementById('painting');
			if (!canvas || !canvas.getContext) return;
			var ctx = canvas.getContext('2d');

			function rng(seed) {
				return function () {
					seed = (seed + 0x6D2B79F5) | 0;
					var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
					t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
					return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
				};
			}

			function noise(seed) {
				var r = rng(seed), table = [];
				for (var i = 0; i < 256; i++) table.push(r());
				function at(a, b) { return table[((a * 73856093) ^ (b * 19349663)) & 255]; }
				return function (x, y) {
					var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
					var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
					var top = at(xi, yi) + (at(xi + 1, yi) - at(xi, yi)) * u;
					var bottom = at(xi, yi + 1) + (at(xi + 1, yi + 1) - at(xi, yi + 1)) * u;
					return top + (bottom - top) * v;
				};
			}

			function paint() {
				var w = window.innerWidth, h = window.innerHeight;
				var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
				canvas.width = Math.round(w * dpr);
				canvas.height = Math.round(h * dpr);
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				ctx.lineCap = 'round';

				var r = rng(1874), flow = noise(7), tone = noise(21), tint = noise(42);
				var unit = Math.max(0.75, Math.min(1.35, Math.min(w, h) / 760));
				var area = w * h;

				// Underpainting
				var under = ctx.createLinearGradient(0, 0, 0, h);
				under.addColorStop(0, '#070d26');
				under.addColorStop(0.55, '#0f2658');
				under.addColorStop(1, '#0a1a3c');
				ctx.fillStyle = under;
				ctx.fillRect(0, 0, w, h);

				// One loaded brushstroke: parallel bristle lines with ragged ends,
				// a lit ridge along one edge and a shadow along the other.
				function stroke(x, y, angle, len, wid, hue, sat, light, alpha) {
					var dx = Math.cos(angle), dy = Math.sin(angle), px = -dy, py = dx;
					var bend = (r() - 0.5) * len * 0.25;
					var n = Math.max(3, Math.round(wid / 2.6));
					ctx.lineWidth = (wid / n) * 1.6;
					for (var i = 0; i < n; i++) {
						var o = (i / (n - 1) - 0.5) * wid;
						var a = len / 2 + (r() - 0.5) * len * 0.2;
						var b = len / 2 + (r() - 0.5) * len * 0.2;
						var l = light + (r() - 0.5) * 9 + (i === 0 ? 10 : i === n - 1 ? -9 : 0);
						ctx.strokeStyle = 'hsla(' + hue + ',' + sat + '%,' + Math.max(3, l) + '%,' + alpha + ')';
						ctx.beginPath();
						ctx.moveTo(x - dx * a + px * o, y - dy * a + py * o);
						ctx.quadraticCurveTo(x + px * (o + bend), y + py * (o + bend), x + dx * b + px * o, y + dy * b + py * o);
						ctx.stroke();
					}
				}

				function wave(x, y) {
					return (flow(x * 0.0025, y * 0.0035) - 0.5) * 1.1 + (r() - 0.5) * 0.28;
				}

				// Blues, from broad dark strokes down to small bright touches
				var layers = [
					{ per: 1500, len: [90, 170], wid: [22, 34], lift: 0 },
					{ per: 700, len: [45, 95], wid: [12, 20], lift: 4 },
					{ per: 850, len: [18, 42], wid: [6, 11], lift: 10 }
				];
				layers.forEach(function (layer) {
					var count = Math.round(area / (layer.per * unit * unit));
					for (var i = 0; i < count; i++) {
						var x = r() * w, y = r() * h;
						var t = tone(x * 0.003, y * 0.004);
						var hue = 232 - 40 * tint(x * 0.002, y * 0.003) + (r() - 0.5) * 8;
						var sat = 52 + r() * 28;
						var light = 6 + 23 * t + 6 * Math.sin(Math.PI * y / h) + layer.lift * r();
						var roll = r();
						if (roll < 0.05) light += 14 + r() * 12;                 // cerulean highlight
						else if (roll < 0.075 && layer.lift) { light = 70 + r() * 12; sat = 35; } // pale blue-white touch
						var len = (layer.len[0] + r() * (layer.len[1] - layer.len[0])) * unit;
						var wid = (layer.wid[0] + r() * (layer.wid[1] - layer.wid[0])) * unit;
						stroke(x, y, wave(x, y), len, wid, hue, sat, light, 0.92);
					}
				});

				// Warm dabs: a few loose columns of reflected light low in the
				// picture, and scattered flecks above.
				var columns = [0.09, 0.83, 0.93];
				var dabs = Math.round(area / (15000 * unit * unit));
				for (var d = 0; d < dabs; d++) {
					var x, y;
					if (r() < 0.72) {
						var c = columns[Math.floor(r() * columns.length)];
						x = c * w + (r() + r() + r() - 1.5) * 46 * unit;
						y = h * (0.42 + r() * 0.58);
					} else {
						x = r() * w;
						y = r() * h * 0.5;
					}
					stroke(x, y, wave(x, y), (12 + r() * 30) * unit, (4 + r() * 6) * unit,
						34 + r() * 16, 70 + r() * 22, 44 + r() * 24, 0.9);
				}
			}

			var paintedW = 0, paintedH = 0, timer;
			function repaint() {
				paintedW = window.innerWidth;
				paintedH = window.innerHeight;
				paint();
			}
			repaint();
			window.addEventListener('resize', function () {
				// Phones resize constantly as the address bar hides; only repaint
				// when the width changes or the window gets noticeably taller.
				if (window.innerWidth === paintedW && window.innerHeight <= paintedH + 120) return;
				clearTimeout(timer);
				timer = setTimeout(repaint, 150);
			});
		})();
	</script>
</body>
</html>
